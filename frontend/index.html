<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Острів</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- model-viewer - веб-компонент від Google для показу 3D-моделей (.glb) без налаштування three.js -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading" class="screen">
    <div class="spinner"></div>
    <p>Створюємо твій острів...</p>
  </div>

  <div id="profile-screen" class="screen hidden">
    <div class="profile-card">
      <!-- Для SVG-заглушки показуємо звичайну картинку -->
      <img id="avatar-img" class="avatar" src="" alt="avatar" />
      <!-- Для справжнього 3D-аватара показуємо інтерактивну модель (можна обертати пальцем) -->
      <model-viewer id="avatar-3d" class="avatar-3d hidden" camera-controls auto-rotate
        camera-orbit="0deg 90deg 2.2m" disable-zoom></model-viewer>

      <h1 id="welcome-title">Ласкаво просимо!</h1>
      <p id="display-name" class="display-name"></p>
      <p id="sub-text" class="sub-text"></p>

      <button id="create-avatar-btn" class="secondary-btn">🧑‍🎨 Створити 3D-аватар</button>
      <button id="continue-btn">Почати будувати острів</button>
    </div>
  </div>

  <div id="error-screen" class="screen hidden">
    <p>Щось пішло не так. Спробуй відкрити застосунок ще раз через бота.</p>
    <p id="error-detail" class="error-detail"></p>
  </div>

  <!-- Overlay з вбудованим конструктором аватара Ready Player Me -->
  <div id="avatar-creator-overlay" class="overlay hidden">
    <button id="close-avatar-creator" class="overlay-close">✕</button>
    <iframe id="avatar-creator-frame" class="avatar-creator-frame" allow="camera *; microphone *"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
