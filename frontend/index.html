<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Острів</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading" class="screen">
    <div class="spinner"></div>
    <p>Створюємо твій острів...</p>
  </div>

  <div id="profile-screen" class="screen hidden">
    <div class="profile-card">
      <img id="avatar-img" class="avatar" src="" alt="avatar" />

      <h1 id="welcome-title">Ласкаво просимо!</h1>
      <p id="display-name" class="display-name"></p>
      <p id="sub-text" class="sub-text"></p>

      <button id="create-avatar-btn" class="secondary-btn">🧑‍🎨 Створити аватар</button>
      <button id="continue-btn">Почати будувати острів</button>
    </div>
  </div>

  <!-- Головне меню -->
  <div id="main-menu" class="screen hidden">
    <div class="menu-bg">
      <img src="assets/beach-sunset.jpg" alt="" class="menu-bg-img" />
      <div class="menu-bg-overlay"></div>
    </div>
    <div class="menu-content">
      <div class="menu-header">
        <img id="menu-avatar" class="menu-avatar" src="" alt="avatar" />
        <h1 id="menu-display-name" class="menu-display-name"></h1>
        <p class="menu-subtitle">Ласкаво просимо на острів!</p>
      </div>
      <div class="menu-cards">
        <button class="menu-card" id="menu-island-btn">
          <img src="assets/beach-palm.jpg" alt="" class="menu-card-img" />
          <div class="menu-card-overlay"></div>
          <span class="menu-card-title">🏝️ Мій острів</span>
        </button>
        <button class="menu-card" id="menu-avatar-btn">
          <img src="assets/forest.jpg" alt="" class="menu-card-img" />
          <div class="menu-card-overlay"></div>
          <span class="menu-card-title">🧑‍🎨 Створити аватар</span>
        </button>
      </div>
    </div>
  </div>

  <div id="error-screen" class="screen hidden">
    <p>Щось пішло не так. Спробуй відкрити застосунок ще раз через бота.</p>
    <p id="error-detail" class="error-detail"></p>
  </div>

  <!-- 3D Planet Screen -->
  <section id="planet-screen" class="hidden">
    <button id="planet-back-btn" class="back-btn">Назад</button>
    <canvas id="planet-canvas"></canvas>
  </section>

  <div id="avatar-builder-overlay" class="overlay hidden">
    <div class="builder-header">
      <span>Створи свого персонажа</span>
      <button id="close-avatar-builder" class="overlay-close-inline">✕</button>
    </div>

    <div class="builder-layout">
      <div class="builder-preview-full">
        <canvas id="avatar-3d-canvas" width="300" height="420"></canvas>
      </div>

      <div class="builder-tabs">
        <button class="builder-tab active" data-tab="skin">Шкіра</button>
        <button class="builder-tab" data-tab="hair">Зачіска</button>
        <button class="builder-tab" data-tab="tops">Кофта</button>
        <button class="builder-tab" data-tab="pants">Штани</button>
        <button class="builder-tab" data-tab="shoes">Взуття</button>
      </div>

      <div class="builder-tab-content active" id="tab-skin">
        <div id="skin-grid" class="item-grid"></div>
      </div>

      <div class="builder-tab-content" id="tab-hair">
        <div id="hair-styles-list" class="items-scroll"></div>
        <p class="builder-label" style="margin-top:12px">Колір волосся</p>
        <div id="hair-color-grid" class="item-grid"></div>
      </div>

      <div class="builder-tab-content" id="tab-tops">
        <div class="filter-row" id="top-brand-filter"></div>
        <div class="filter-row" id="top-fit-filter"></div>
        <div id="tops-list" class="items-scroll"></div>
      </div>

      <div class="builder-tab-content" id="tab-pants">
        <div class="filter-row" id="pants-brand-filter"></div>
        <div id="pants-list" class="items-scroll"></div>
      </div>

      <div class="builder-tab-content" id="tab-shoes">
        <div class="filter-row" id="shoes-brand-filter"></div>
        <div id="shoes-list" class="items-scroll"></div>
      </div>
    </div>

    <button id="save-avatar-btn" class="save-avatar-btn">Зберегти аватар</button>
  </div>

  <!-- three.js vendored locally (0.150.1) so it works in Telegram WebView without CDN -->
  <script src="vendor/three.min.js"></script>

  <!-- Load app.js last, without defer, so THREE is guaranteed -->
  <script src="app.js"></script>
</body>
</html>
