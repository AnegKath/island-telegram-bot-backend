app = "island-mvp-backend"
primary_region = "ams"

[build]

[env]
PORT = "8080"

[[services]]
protocol = "tcp"
internal_port = 8080
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[services.ports]]
handlers = ["http"]
port = 80

[[services.ports]]
handlers = ["tls", "http"]
port = 443

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "10s"
